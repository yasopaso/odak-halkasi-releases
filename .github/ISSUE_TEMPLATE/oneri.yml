name: Öneri
description: Bir özelliği veya kullanım deneyimini geliştirmek için fikir paylaş.
title: "[Öneri]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Neyi daha kolay yapmak istiyorsun?
      placeholder: Hangi durumda zorlandığını veya neye ihtiyaç duyduğunu anlat.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Önerin nedir?
      placeholder: Aklındaki değişikliği kısaca anlat.
    validations:
      required: true
